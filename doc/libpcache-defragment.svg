<svg xmlns="http://www.w3.org/2000/svg" width="850" height="450" viewBox="0 0 850 450" role="img" aria-label="libpcache defragmentation animation. A FIXED volume holds 5 pages spread over 9 slots. pcache_defragment copies each page into the lowest free slot, then repoints its index row; the progress callback cancels after two moves, leaving the volume consistent; a second call finishes the job and the data file is truncated from 9 to 5 slots.">
<title>libpcache: defragmentation</title>
<defs>
<pattern id="fgmin" width="16" height="16" patternUnits="userSpaceOnUse"><path d="M16 0H0V16" fill="none" stroke="rgba(31,79,168,.13)" stroke-width="1"></path></pattern>
<pattern id="fgmaj" width="80" height="80" patternUnits="userSpaceOnUse"><rect width="80" height="80" fill="url(#fgmin)"></rect><path d="M80 0H0V80" fill="none" stroke="rgba(31,79,168,.28)" stroke-width="1"></path></pattern>
<pattern id="fhatch" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="6" stroke="#3a372e" stroke-width="1"></line></pattern>
<pattern id="fhatchl" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="6" stroke="#f4efe0" stroke-opacity=".45" stroke-width="1"></line></pattern>
<style>
.disp{font-family:"Big Shoulders Display","Arial Narrow",sans-serif;font-weight:800;letter-spacing:.02em}
.lbl,.cell,.note,.cap{font-family:"IBM Plex Mono",ui-monospace,Menlo,Consolas,"Courier New",monospace}
